  <title>OiVox — Welcome</title>
  <script>
// A separately hosted page can receive the App's locale as ?lang=fr.
(() => {
  const supported = ['en', 'ar', 'he', 'tr', 'fr', 'de', 'ja', 'ko'];
  let saved;
  try { saved = localStorage.getItem('oivox.preferredLanguage'); } catch {}
  const fromURL = new URLSearchParams(location.search).get('lang');
  const choices = [fromURL, saved, window.__OIVOX_NATIVE_LANGUAGE__, ...(navigator.languages || []), navigator.language];
  const locale = choices.map(code => {
    const base = typeof code === 'string' ? code.toLowerCase().split(/[-_]/)[0] : '';
    return base === 'iw' ? 'he' : base;
  }).find(code => supported.includes(code)) || 'en';
  document.documentElement.lang = locale;
  document.documentElement.dir = ['ar', 'he'].includes(locale) ? 'rtl' : 'ltr';
})();
  </script>

:root {
  color-scheme: light;
  font-family: Figtree, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #1d1b1a;
  background: var(--background);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  inline-size: 100%;
  block-size: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
body { position: fixed; inset: 0; }
img, svg { -webkit-user-drag: none; }
img { display: block; }
h1, h2, p, figure { margin: 0; }
html:not([lang="en"]):not(.localized) .screen { visibility: hidden; }
.screen {
  --gutter: clamp(18px, 5.86vw, 24px);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --sides: max(var(--gutter), var(--safe-left), var(--safe-right));
  block-size: 100vh;
  block-size: 100dvh;
  overflow: hidden;
  padding: calc(var(--top, 14px) + var(--safe-top)) var(--sides)
    calc(var(--bottom, 16px) + var(--safe-bottom));
}
.frame { position: relative; inline-size: min(100%, 448px); block-size: 100%; margin-inline: auto; min-inline-size: 0; }
.brand-icon { inline-size: var(--icon-size, 36px); block-size: var(--icon-size, 36px); border-radius: 26%; flex: none; }
.actions { position: relative; min-inline-size: 0; }
.primary {
  position: relative;
  display: grid;
  place-items: center;
  inline-size: 100%;
  min-block-size: 54px;
  padding: 10px 44px;
  border: 0;
  border-radius: 999px;
  background: var(--button-color);
  color: #fff;
  box-shadow: var(--button-shadow);
  font: 800 16px/19px Figtree, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .14s ease, box-shadow .14s ease, opacity .14s ease;
}
.primary:active:not(:disabled) { transform: scale(.98); box-shadow: none; }
.primary:focus-visible, .rules-scroll:focus-visible { outline: 2px solid #5f45b5; outline-offset: 3px; }
.primary:disabled { cursor: default; opacity: .8; }
.button-feedback {
  position: absolute;
  inset-inline-end: 18px;
  display: grid;
  place-items: center;
  inline-size: 18px;
  block-size: 18px;
  opacity: 0;
}
.button-feedback > svg { display: none; inline-size: 18px; block-size: 18px; }
.primary[data-state="waiting"] .button-feedback {
  opacity: 1;
  border: 2px solid rgba(255,255,255,.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
.primary[data-state="acknowledged"] .button-feedback,
.primary[data-state="acknowledged"] .button-feedback > svg { opacity: 1; display: grid; }
@keyframes spin { to { transform: rotate(360deg); } }
.feedback-message {
  position: absolute;
  inset-inline: 0;
  inset-block-end: calc(100% + 8px);
  z-index: 3;
  padding: 8px 12px;
  border-radius: 12px;
  color: #8c2739;
  background: #fff0f2;
  box-shadow: 0 3px 10px rgba(29,27,26,.14);
  text-align: center;
  font-size: 13px;
  line-height: 1.4;
}
.feedback-message:empty { display: none; }
@media (max-height: 430px) and (orientation: landscape) {
  .screen { --top: 8px; --bottom: 7px; }
  .primary { min-block-size: 44px; }
}
@media (prefers-reduced-motion: reduce) {
  .primary { transition: none; }
  .primary[data-state="waiting"] .button-feedback { animation: none; }
}

:root {
  --background: #f6f1f8;
  --button-color: rgba(43,45,75,1);
  --button-shadow: 0 10px 24px rgba(32,33,58,.2);
}
.screen {
  --top: clamp(13px, 2.25dvh, 22px);
  --bottom: clamp(12px, 2.05dvh, 20px);
  position: relative;
  background:
    radial-gradient(circle 95px at calc(100% - 35px) 218px, rgba(226,216,248,.42) 99%, transparent 100%),
    radial-gradient(circle 110px at 48px 440px, rgba(255,232,214,.4) 99%, transparent 100%),
    linear-gradient(170deg, #f4f0fa 0%, #f6f1f8 44%, #faf2ec 100%);
  touch-action: none;
}
.frame {
  display: grid;
  grid-template: "brand" auto "intro" auto "art" minmax(0,1fr) "actions" auto / minmax(0,1fr);
  gap: clamp(9px, 2.45dvh, 25px);
}
.brand { grid-area: brand; display: flex; align-items: center; gap: 10px; min-inline-size: 0; }
.brand-copy { display: grid; gap: 5px; }
.wordmark { justify-self: start; font-size: 25px; line-height: 1; font-weight: 800; letter-spacing: -.03em; }
.eyebrow { color: #5c6384; font-size: 10px; line-height: 1.2; font-weight: 700; letter-spacing: .17em; text-transform: uppercase; }
.intro { grid-area: intro; position: relative; }
.intro h1 {
  position: relative;
  z-index: 1;
  font-size: clamp(25px, 8vw, 34px);
  line-height: 1.1;
  font-weight: 800;
  letter-spacing: -.03em;
  overflow-wrap: anywhere;
}
.intro h1 span { display: block; }
.intro p { max-inline-size: 17em; margin-block-start: 9px; color: #6c6560; font-size: clamp(15px, 4.8vw, 18px); line-height: 1.23; font-weight: 700; }
.voice-note {
  float: inline-end;
  margin: 6px 0 3px 7px;
  inline-size: 57px;
  text-align: center;
  white-space: pre-line;
  font: 700 21px/1.04 Caveat, "Noteworthy", -apple-system, sans-serif;
  transform: rotate(-7deg);
}
.voice-note svg { display: block; inline-size: 90%; margin: 3px auto 0; }
html[dir="rtl"] .voice-note { margin-inline: 7px 0; transform: rotate(7deg); }
html[dir="rtl"] .eyebrow, html[dir="rtl"] h1 { letter-spacing: normal; }
.art-stage { grid-area: art; display: grid; align-items: start; justify-items: center; container-type: size; min-block-size: 0; }
.voice-art {
  position: relative;
  inline-size: min(100%, 46vh, 390px);
  inline-size: min(100%, 104cqh, 390px);
  aspect-ratio: 1.07;
  container-type: inline-size;
}
.polaroid {
  --tilt: -2.5deg;
  position: absolute;
  display: grid;
  grid-template-rows: minmax(0,1fr) auto;
  min-inline-size: 0;
  background: #fff;
  border-radius: clamp(8px, 3.5cqw, 12px);
  padding: clamp(4px, 2.45cqw, 9px);
  transform: rotate(var(--tilt));
  box-shadow: 0 12px 26px rgba(74,63,117,.2);
}
.polaroid.front { inset-block: 3% 2%; inset-inline-start: 2%; inline-size: 79%; z-index: 1; }
.polaroid.back { --tilt: 4deg; inset-block: 11% 7%; inset-inline-end: 2%; inline-size: 47%; }
html[dir="rtl"] .polaroid.front { --tilt: 2.5deg; }
html[dir="rtl"] .polaroid.back { --tilt: -4deg; }
.portrait { position: relative; min-block-size: 0; overflow: hidden; border-radius: clamp(5px, 2.6cqw, 8px); }
.portrait img { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; object-fit: cover; object-position: center 36%; }
.card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 5px;
  padding: 5px 3px 0;
  min-block-size: clamp(17px, 9cqw, 32px);
  line-height: 1;
}
.back .card-meta { justify-content: end; }
.card-meta strong, .card-meta small { display: block; }
.card-meta strong { font-size: clamp(9px, 4.2cqw, 14px); font-weight: 800; }
.card-meta small { margin-block-start: 3px; color: #6c6560; font-size: clamp(8px, 3.2cqw, 11px); }
.card-sound { display: flex; align-items: center; gap: clamp(3px, 1.5cqw, 7px); color: #a93a63; }
.card-sound svg { inline-size: clamp(16px, 13cqw, 46px); }
.time { color: #6c6560; font-size: clamp(8px, 3.2cqw, 11px); font-variant-numeric: tabular-nums; }
.actions { grid-area: actions; }
.closing-line { margin-block-start: 10px; color: #5c6384; text-align: center; font-size: 12px; line-height: 1.25; font-weight: 700; }
html[dir="rtl"] .closing-line { letter-spacing: normal; }
@media (max-height: 650px) and (orientation: portrait) {
  .screen { --top: 12px; --bottom: 10px; }
  .frame { gap: 10px; }
  .voice-note { font-size: 18px; inline-size: 45px; }
  .intro p { margin-block-start: 6px; }
  .closing-line { margin-block-start: 7px; }
}
@media (orientation: landscape) and (max-height: 600px) {
  .frame {
    inline-size: min(100%, 650px);
    grid-template: "brand art" auto "intro art" minmax(0,1fr) "actions actions" auto / minmax(0,1fr) minmax(0,1fr);
    align-items: start;
    column-gap: clamp(14px, 4.2vw, 34px);
    row-gap: 8px;
  }
  .brand { --icon-size: 30px; }
  .intro { align-self: center; }
  .intro h1 { font-size: clamp(20px, 4.15vw, 31px); }
  .intro p { font-size: 14px; margin-block-start: 6px; }
  .voice-note { inline-size: 43px; font-size: 17px; }
  .art-stage { align-self: stretch; align-items: center; }
  .voice-art { inline-size: min(100%, 100cqh, 355px); }
  .actions { inline-size: min(100%, 448px); justify-self: center; }
  .closing-line { margin-block-start: 6px; }
}
@media (max-height: 340px) and (orientation: landscape) {
  .intro h1 { font-size: clamp(18px, 3.8vw, 26px); }
  .intro p { font-size: 13px; }
  .brand-copy { gap: 3px; }
}

/* The welcome settles into its regular layout after a single entrance. */
@media (prefers-reduced-motion: no-preference) {
  .screen[data-intro="entering"] { --entrance-direction: 1; }
  html[dir="rtl"] .screen[data-intro="entering"] { --entrance-direction: -1; }

  [data-intro="entering"] .brand,
  [data-intro="entering"] .intro {
    animation: welcome-copy-in 460ms cubic-bezier(.22,.68,.26,1) backwards;
  }
  [data-intro="entering"] .intro { animation-delay: 65ms; }

  [data-intro="entering"] .polaroid {
    animation: welcome-card-in var(--entrance-duration) cubic-bezier(.2,.7,.24,1) var(--entrance-delay) backwards;
  }
  [data-intro="entering"] .polaroid.back {
    --entrance-duration: 620ms;
    --entrance-delay: 85ms;
    --entrance-opacity: .8;
    --entrance-offset: calc(8px * var(--entrance-direction));
    --entrance-angle: calc(4deg * var(--entrance-direction));
  }
  [data-intro="entering"] .polaroid.front {
    --entrance-duration: 660ms;
    --entrance-delay: 175ms;
    --entrance-opacity: .98;
    --entrance-offset: calc(-6px * var(--entrance-direction));
    --entrance-angle: calc(-3deg * var(--entrance-direction));
  }

  [data-intro="entering"] .voice-note path {
    stroke-dasharray: 1;
    animation: welcome-ink 500ms cubic-bezier(.38,.1,.3,1) 310ms backwards;
  }

  [data-intro="entering"] .front .portrait::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(110deg, transparent 30%, rgba(255,248,238,.38) 49%, transparent 67%);
    animation: welcome-light 580ms ease-in-out 460ms both;
  }

  [data-intro="entering"] .wave-rest {
    animation: welcome-wave-hide 780ms linear 875ms;
  }
  [data-intro="entering"] .wave-motion {
    animation: welcome-wave-show 780ms linear 875ms;
  }
  [data-intro="entering"] .wave-motion path {
    --wave-delay: 890ms;
    --wave-peak: 1.25;
    transform-box: view-box;
    transform-origin: center;
    animation: welcome-wave 580ms ease-in-out var(--wave-delay);
  }
  [data-intro="entering"] .wave-motion path:nth-child(3n+2) {
    --wave-delay: 960ms;
    --wave-peak: 1.4;
  }
  [data-intro="entering"] .wave-motion path:nth-child(3n) {
    --wave-delay: 1040ms;
    --wave-peak: 1.3;
  }
  [data-intro="entering"] .card-sound svg {
    animation: welcome-wave-tone 780ms ease-in-out 875ms;
  }

  @keyframes welcome-copy-in {
    from { opacity: .68; transform: translateY(5px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes welcome-card-in {
    from {
      opacity: var(--entrance-opacity);
      transform: translate(var(--entrance-offset), 12px)
        rotate(calc(var(--tilt) + var(--entrance-angle))) scale(.965);
    }
    to { opacity: 1; transform: rotate(var(--tilt)); }
  }
  @keyframes welcome-ink {
    from { stroke-dashoffset: 1; }
    to { stroke-dashoffset: 0; }
  }
  @keyframes welcome-light {
    from { opacity: 0; transform: translateX(calc(-85% * var(--entrance-direction))); }
    48% { opacity: .62; }
    to { opacity: 0; transform: translateX(calc(85% * var(--entrance-direction))); }
  }
  @keyframes welcome-wave {
    0%, 100% { transform: scaleY(1); }
    22% { transform: scaleY(.68); }
    49% { transform: scaleY(var(--wave-peak)); }
    76% { transform: scaleY(.86); }
  }
  @keyframes welcome-wave-hide {
    from, to { visibility: hidden; }
  }
  @keyframes welcome-wave-show {
    from, to { visibility: visible; }
  }
  @keyframes welcome-wave-tone {
    0%, 100% { opacity: 1; }
    38% { opacity: .7; }
  }
}
  </style>

    const fail = () => {
      if (attempt !== current) return;
      reset();
      feedback.textContent = labels.tryAgain;
    };
    setState('waiting');
    try {
      const handler = window.webkit?.messageHandlers?.[channel];
      if (typeof handler?.postMessage === 'function') {
        timer = setTimeout(fail, waitForHostMs);
        // A regular WKScriptMessageHandler gives no reply. Wait for the host to leave this document.
        // Also recover if a reply-capable handler rejects.
        Promise.resolve(handler.postMessage(message)).catch(fail);
      } else if (window.__OIVOX_NATIVE_BRIDGE__?.available) {
        fail();
      } else {
        // Browser opens the page independently; acknowledge the tap without faking App navigation.
        setState('acknowledged');
        timer = setTimeout(reset, 650);
      }
    } catch {
      fail();
    }
  });
  window.addEventListener('pagehide', reset);

  const prevent = event => { if (event.cancelable) event.preventDefault(); };
  for (const type of ['contextmenu', 'selectstart', 'dragstart', 'copy', 'dblclick', 'gesturestart', 'gesturechange', 'gestureend']) {
    document.addEventListener(type, prevent, { passive: false });
  }

  // Scope gesture guards to this document; let regular taps and the rules pane's
  // vertical scrolling use WebKit's default handling.
  let previousY;
  document.addEventListener('touchstart', event => {
    if (event.touches.length > 1) prevent(event);
    previousY = event.touches[0]?.clientY;
  }, { passive: false });
  document.addEventListener('touchmove', event => {
    const y = event.touches[0]?.clientY;
    const delta = y - previousY;
    previousY = y;
    if (event.touches.length !== 1 || !scroll?.contains(event.target)) {
      prevent(event);
      return;
    }
    const remaining = scroll.scrollHeight - scroll.clientHeight - scroll.scrollTop;
    if ((delta > 0 && scroll.scrollTop <= 0) || (delta < 0 && remaining <= 1)) prevent(event);
  }, { passive: false });
  document.addEventListener('wheel', event => {
    if (event.ctrlKey || !scroll?.contains(event.target)) prevent(event);
  }, { passive: false });
})();
  </script>
</body>
</html>
