    }
    h1, h2, p, figure { margin: 0; }
    img, svg { display: block; -webkit-user-drag: none; }
    button { font: inherit; touch-action: manipulation; }
    .frame {
      width: 100%;
      height: 100%;
      margin-inline: auto;
      padding: max(18px, calc(var(--safe-top) + 6px))
        max(22px, calc(var(--safe-right) + 12px))
        max(16px, calc(var(--safe-bottom) + 8px))
        max(22px, calc(var(--safe-left) + 12px));
    }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand img { width: 42px; height: 42px; border-radius: 11px; flex: none; }
    .brand-meta { display: flex; flex-direction: column; gap: 1px; }
    .brand-name { font-size: 16px; font-weight: 780; letter-spacing: -.025em; line-height: 1.15; }
    .brand-note {
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .135em;
      line-height: 1.3;
      text-transform: uppercase;
    }
    .eyebrow {
      display: flex; align-items: center; gap: 8px;
      color: var(--pink); font-size: 10px; font-weight: 780;
      letter-spacing: .135em; line-height: 1.35; text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 17px; height: 1px; background: currentColor; }
    .primary {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 54px;
      padding: 10px 48px;
      border: 1px solid #ffffff27;
      border-radius: 16px;
      background: linear-gradient(90deg, #F6D18A 0%, #E9B45A 100%);
      box-shadow: 0 9px 24px #e9b45a24, inset 0 1px 0 #ffffff38;
      color: #2f1f0e;
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
    }
    .primary:not(:disabled):active { transform: scale(.977); filter: brightness(.88); }
    .primary:disabled { cursor: wait; }
    .primary:focus-visible, .rule-reading:focus-visible {
      outline: 2px solid #F6D18A; outline-offset: 3px;
    }
    .primary-icon {
      position: absolute;
      right: 17px;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translateY(-50%);
    }
    .spinner {
      display: none;
      position: absolute;
      right: 17px;
      top: calc(50% - 9px);
      width: 18px;
      height: 18px;
      border: 2px solid #2f1f0e38;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    .primary[aria-busy="true"] .primary-icon { display: none; }
    .primary[aria-busy="true"] .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-height: 650px) {
      .frame { padding-top: max(13px, calc(var(--safe-top) + 3px)); padding-bottom: max(12px, calc(var(--safe-bottom) + 5px)); }
      .brand img { width: 36px; height: 36px; border-radius: 9px; }
      .primary { min-height: 48px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }

    html, body { touch-action: none; }
    .welcome {
      max-width: 490px;
      display: grid;
      grid-template: "mast" auto "art" minmax(0, 1fr) "copy" auto "foot" auto / minmax(0, 1fr);
      row-gap: clamp(12px, 3.2vh, 29px);
    }
    .brand { grid-area: mast; }
    .postcard { grid-area: art; display: grid; min-height: 0; place-items: center; }
    .postcard svg { width: 100%; height: 100%; max-height: 435px; overflow: visible; }
    .riverside-photo {
      transform-box: fill-box;
      transform-origin: 60% 65%;
      animation: riverside-arrival 4.5s cubic-bezier(.2, .65, .28, 1) both;
    }
    @keyframes riverside-arrival {
      from { transform: scale(1); }
      to { transform: scale(1.055); }
    }
    .welcome-copy { grid-area: copy; align-self: center; }
    .eyebrow { margin-bottom: 9px; }
    h1 {
      font-size: clamp(38px, 11.2vw, 62px);
      font-weight: 830;
      line-height: .99;
      letter-spacing: -.053em;
    }
    h1 span { display: block; color: #f3ace5; }
    .description {
      max-width: 33ch;
      margin-top: 13px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }
    .welcome-footer { grid-area: foot; }
    @media (max-height: 650px) {
      .welcome { row-gap: 12px; }
      h1 { font-size: clamp(32px, 9.6vw, 46px); }
      .description { margin-top: 8px; font-size: 14px; }
      .eyebrow { margin-bottom: 6px; }
    }
    @media (orientation: landscape) and (min-width: 520px) {
      .welcome {
        max-width: 950px;
        grid-template: "art mast" auto "art copy" minmax(0, 1fr) "art foot" auto / minmax(0, 1.1fr) minmax(0, 1fr);
        gap: 10px clamp(22px, 5vw, 64px);
      }
      h1 { font-size: clamp(30px, 6vw, 63px); }
      .description { margin-top: 8px; }
    }
    @media (orientation: landscape) and (max-height: 360px) {
      h1 { font-size: clamp(28px, 5.7vw, 42px); }
      .description { font-size: 13px; }
    }
  </style>
</head>
<body>

    <section class="welcome-copy">
      <p class="eyebrow">Welcome to Havra</p>
      <h1 id="welcome-title">Life, as lived <span>here.</span></h1>
      <p class="description">Morning markets, ferry rides, and family tables. Discover everyday stories from across Southeast Asia.</p>
    </section>
    <footer class="welcome-footer">
      <button class="primary" type="button" aria-busy="false">
        <span class="primary-label">Continue</span>
        <span class="primary-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4.5 12h14m-6-6 6 6-6 6"/></svg></span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
    </footer>
  </main>
  <script>
    (() => {
      "use strict";
      const button = document.querySelector(".primary");
      const label = button.querySelector(".primary-label");
      const initialLabel = label.textContent;
      const reading = document.querySelector(".rule-reading");
      let waiting = false;
      let lastY = null;

      function restore(text = initialLabel) {
        waiting = false;
        button.disabled = false;
        button.setAttribute("aria-busy", "false");
        label.textContent = text;
      }

      button.addEventListener("click", () => {
        if (waiting) return;
        waiting = true;
        button.disabled = true;
        button.setAttribute("aria-busy", "true");
        label.textContent = "Please wait…";
        const handler = window.webkit?.messageHandlers?.havraWelcome;
        if (typeof handler?.postMessage === "function") {
          try {
            handler.postMessage({ action: "Sure", source: "havraWelcome" });
          } catch {
            restore("Try again");
          }
          return;
        }
        // In a browser there is no native host to take over navigation.
        window.setTimeout(restore, 700);
      });

      window.addEventListener("pageshow", (event) => {
        if (event.persisted) restore();
      });

      function prevent(event) { if (event.cancelable) event.preventDefault(); }
      for (const name of ["gesturestart", "gesturechange", "gestureend", "dblclick", "contextmenu", "selectstart", "copy", "dragstart"]) {
        document.addEventListener(name, prevent, { passive: false });
      }

      document.addEventListener("touchstart", (event) => {
        lastY = event.touches.length === 1 ? event.touches[0].clientY : null;
        if (event.touches.length > 1) prevent(event);
      }, { passive: false });
      document.addEventListener("touchmove", (event) => {
        if (event.touches.length !== 1 || !reading?.contains(event.target)) {
          prevent(event);
          return;
        }
        const y = event.touches[0].clientY;
        const delta = lastY === null ? 0 : y - lastY;
        lastY = y;
        const end = reading.scrollHeight - reading.clientHeight;
        if (end <= 1 || (delta > 0 && reading.scrollTop <= 0) ||
            (delta < 0 && reading.scrollTop >= end - 1)) prevent(event);
      }, { passive: false });
      for (const name of ["touchend", "touchcancel"]) {
        document.addEventListener(name, () => { lastY = null; }, { passive: true });
      }
    })();
  </script>
