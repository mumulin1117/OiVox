  "privacy": {
    "title": "Privacy Policy",
    "updated": "October 15, 2026 · v3",
    "intro": "This policy describes the data OiVox processes, why it is used, where the current app stores it, and the controls available to you. OiVox does not use precise location, third-party advertising, or cross-app tracking in the current app.",
    "sections": [
      {
        "title": "1. Data you provide",
        "paragraphs": [
          "Account data includes email, password credentials in protected form, age range, terms acceptance, and session information. Profile data may include nickname, avatar reference, country, time zone, About me, spoken and preferred languages, interests, questionnaire answers, and communication preferences. We do not require your real name, phone number, or precise location.",
          "This entry flow uses the account information you enter, app version and a device identifier to look up the account or manage verification. If the host provides a notification token, the entry service may also receive it."
        ]
      },
      {
        "title": "2. Voice, social, and support data",
        "paragraphs": [
          "Depending on what you use, data can include voice clips, transcripts and translations, likes and skips, friend relationships and requests, messages, call state, blocks, reports, support text, notification preferences, coin balance, product identifiers, and StoreKit transaction identifiers."
        ]
      },
      {
        "title": "3. Camera, microphone, Photos, and verification",
        "paragraphs": [
          "OiVox requests camera access for an avatar, live-person check, or video; microphone access for verification, voice clips, messages, or calls; Photos access when you choose an avatar; and notifications when you request reminders. Permission choices are controlled by iOS.",
          "This OiVox entry flow uses Amazon Web Services (AWS) to process a short camera recording for a liveness check. It checks that a live person is present and does not compare faces or determine your age. The verification service receives the result and may retain a reference image generated during the check for safety and verification. The camera check does not make the recording or reference image part of your public profile."
        ]
      },
      {
        "title": "4. How data is used",
        "paragraphs": [
          "We use data to create and authenticate accounts; show profiles and voice discovery; play, send, and translate content; manage daily recommendations, relationships, blocks, reports, and coins; provide requested support; protect users; prevent duplicate or fraudulent operations; remember language and privacy choices; diagnose failures; and comply with law. We do not use private content to train an advertising profile."
        ]
      },
      {
        "title": "5. Storage and sharing",
        "paragraphs": [
          "Account and profile records are handled by the OiVox account service, session tokens are protected in iOS Keychain, and custom avatars are kept in the app sandbox. Apple processes App Store payments and permission services. OiVox does not sell personal data or use third-party advertising or cross-app tracking.",
          "AWS processes camera video for the liveness check as described above. Verification data is used to operate the check and protect access to the service."
        ]
      },
      {
        "title": "6. Visibility and your choices",
        "paragraphs": [
          "You choose which supported profile fields are public. Hidden fields are removed from the display model, not merely covered by CSS. Published clips and public profile fields can be seen by eligible users; direct messages are limited to supported friend interactions. You can pause requests, control reminders, change app language, revoke iOS permissions, report, block, and edit supported profile fields."
        ]
      },
      {
        "title": "7. Retention and deletion",
        "paragraphs": [
          "Account records are retained while the account is active. Transaction, security, and report records may be retained only as long as reasonably necessary for fraud prevention, legal duties, or dispute handling. You can request deletion through the available account controls.",
          "Contact OiVox support with questions about verification records or to request deletion."
        ]
      },
      {
        "title": "8. Security, age, and international use",
        "paragraphs": [
          "OiVox uses access controls, hashed passwords, Keychain session storage, stable identifiers, and operation idempotency appropriate to the current architecture, but no system is perfectly secure. Do not send highly sensitive information in chats. OiVox is not for users under 18. Where applicable, cross-border processing is subject to the safeguards required by law."
        ]
      },
      {
        "title": "9. Your privacy rights",
        "paragraphs": [
          "Depending on where you live, you may request access, correction, deletion, restriction, portability, or objection, and may withdraw consent without affecting earlier lawful processing. Use profile controls, iOS Settings, Delete Account where connected, or in-app support. We may verify a request before acting. You may also complain to your local privacy authority."
        ]
      },
      {
        "title": "10. Changes and contact",
        "paragraphs": [
          "Material changes update the effective date and version and may require renewed agreement. Contact OiVox through in-app support with questions about this policy."
        ]
      }
    ],
    "contact": "Contact support: OiVox@gmail.com. You can also report inappropriate activity through Settings › Privacy & safety › Contact support."
  },
  "terms": {
    "title": "Terms of Service",
    "updated": "October 15, 2026 · v3",
    "intro": "These terms explain the rules for accounts, voice discovery, friendships, messaging, translation, coins, safety, and service availability.",
    "sections": [
      {
        "title": "1. Account and age",
        "paragraphs": [
          "OiVox is for people aged 18 or older. Registration uses email and password and requires a nickname and confirmed avatar. Keep credentials confidential and keep profile information accurate. One person may not impersonate another, automate registrations, sell accounts, or evade a suspension.",
          "Some OiVox entry flows also require a nickname and a live camera check before you can proceed. Review the Privacy Policy for details about the check."
        ]
      },
      {
        "title": "2. How OiVox works",
        "paragraphs": [
          "OiVox lets you publish a short voice clip, discover voices by country or region, like or skip recommendations, send one friendship request before acceptance, and communicate by text, voice, or one-to-one video after friendship is established. A like is not friendship and does not grant messaging or calling access."
        ]
      },
      {
        "title": "3. Content responsibility",
        "paragraphs": [
          "You are responsible for content you create, send, or publish and for having the rights to it. Public profile fields and published voice clips may be visible to other users according to your privacy settings. Private fields must not be exposed merely by hiding them visually. Original content and translations are stored separately; translation never changes the original."
        ]
      },
      {
        "title": "4. Safety and acceptable use",
        "paragraphs": [
          "Treat people respectfully. Prohibited activity includes sexual exploitation, harassment, hate, threats, doxxing, fraud, spam, unlawful conduct, intellectual-property infringement, non-consensual recordings, malicious links, attempts to identify precise locations, and circumventing privacy, moderation, blocks, permissions, or security. OiVox may act on reports and repeat violations."
        ]
      },
      {
        "title": "5. Social and communication features",
        "paragraphs": [
          "Friend requests can be accepted or declined. Continuous chat and video are available only to friends who are not blocked. Blocking immediately prevents further interaction in supported features. Never share financial credentials, government identifiers, intimate material, or other sensitive information in messages. Users are responsible for deciding whether an offline meeting is safe."
        ]
      },
      {
        "title": "6. Translation and suggestions",
        "paragraphs": [
